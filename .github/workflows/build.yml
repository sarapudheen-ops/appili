name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # No android-actions/setup-android here on purpose. It failed intermittently on this
      # repository's own runs (41255954864 step 4, 41256856854 step 4) and succeeded on others,
      # which made the whole gate a coin toss — and it is redundant, because ubuntu-latest ships
      # the Android SDK. This step provisions exactly what app/build.gradle.kts needs instead.
      - name: Provision the Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "Android SDK: $SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # compileSdk/targetSdk 34, minSdk 26 (app/build.gradle.kts).
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - run: chmod +x gradlew
      - name: Build & Test
        run: |
          set -o pipefail
          ./gradlew clean lintDebug testDebugUnitTest assembleDebug 2>&1 | tee gradle.log
      - name: Failure detail
        if: failure()
        run: |
          echo "java: $(java -version 2>&1 | head -n 1)"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          # The gate is one command, so a failure is one line in a long log. Collect the
          # informative lines — failing unit tests first, then compiler errors, the failed
          # task and Gradle's own failure block — and re-emit them as annotations, which
          # GitHub shows in the run summary (and caps at ten per step).
          {
            for report in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -e "$report" ] || continue
              awk '/<testcase /{c="?"; if (match($0,/name="[^"]*"/)) c=substr($0,RSTART+6,RLENGTH-7)} /<failure /{m="failed"; if (match($0,/message="[^"]*"/)) m=substr($0,RSTART+9,RLENGTH-10); print "TEST " c " :: " substr(m,1,200)}' "$report"
            done | head -n 4
            if [ -f gradle.log ]; then
              {
                grep -E '^(e: )' gradle.log || true
                grep -E '^> Task .* FAILED' gradle.log || true
                awk '/^FAILURE:/{flag=1} flag' gradle.log | head -n 14 || true
                tail -n 4 gradle.log || true
              } | awk 'NF' | awk '!seen[$0]++' | head -n 6
            fi
          } > detail.txt
          while IFS= read -r line; do
            printf '%s\n' "$line"
            printf '::error::%s\n' "${line//%/%25}"
          done < detail.txt
