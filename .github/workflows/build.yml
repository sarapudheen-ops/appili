name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # Kept for convenience, but not relied on: the ubuntu-latest image already ships the
      # Android SDK, so the next step provisions exactly what the build needs.
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Provision the Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "Android SDK: $SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # compileSdk/targetSdk 34, minSdk 26 (app/build.gradle.kts).
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - run: chmod +x gradlew
      - name: Build & Test
        run: |
          set -o pipefail
          ./gradlew clean lintDebug testDebugUnitTest assembleDebug 2>&1 | tee gradle.log
      - name: Failure detail
        if: failure()
        run: |
          # The gate is one command; when it fails, the reason is somewhere in a long log.
          # Re-emit the interesting lines as annotations so the failure is readable in the
          # run summary instead of being buried.
          echo "--- environment ---"
          java -version 2>&1 || true
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "--- failing tasks / errors ---"
          grep -nE '(^e: |> Task .*FAILED|^FAILURE:|^> .*|error:|FAILED)' gradle.log 2>/dev/null | tail -n 40 || true
          echo "--- tail of the log ---"
          tail -n 30 gradle.log 2>/dev/null || true
          if [ -f gradle.log ]; then
            grep -nE '(^e: |> Task .*FAILED|^FAILURE:|^> |error:|FAILED)' gradle.log | tail -n 35 | while IFS= read -r line; do
              escaped="${line//%/%25}"
              escaped="${escaped//$'\r'/%0D}"
              escaped="${escaped//$'\n'/%0A}"
              escaped="${escaped//: / - }"
              echo "::error::${escaped}"
            done
          fi
